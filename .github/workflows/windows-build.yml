name: Build Windows Desktop

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress build artifacts
        shell: powershell
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MathCalcu-Windows.zip

      - name: Determine tag
        id: tag
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            echo "tag=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=${{ github.event.inputs.tag }}" >> $env:GITHUB_OUTPUT
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: MathCalcu-Windows.zip
          token: ${{ secrets.GITHUB_TOKEN }}
